<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>go6sim · CodeLab (local spike)</title>
<!-- Theme: pre-paint light/dark pick (dark default; key shared with thecarledwards.com projects). Remove for dark-only. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var light = saved === 'light' ||
        (!saved && window.matchMedia('(prefers-color-scheme: light)').matches);
      if (light) document.documentElement.classList.add('light');
    } catch (e) {}
  })();
</script>
<style>
  /* Palette matches thecarledwards.com (Chirpy dark). The LEDs are the
     "instrument" and keep their own fixed colors. */
  :root{color-scheme:dark;--bg:#1b1b1e;--panel:#1e1e1e;--chip:#292929;--border:#333437;--muted:#868686;--text:#afb0b1;--fg:#cccccc;--accent:#8ab4f8}
  /* --- light theme (remove this block + the toggle for dark-only) --- */
  :root.light{color-scheme:light;--bg:#ffffff;--panel:#f6f8fa;--chip:#e9ecef;--border:#dee2e6;--muted:#757575;--text:#34343c;--fg:#2a2a2a;--accent:#0056b2}
  #theme-toggle{position:fixed;top:6px;right:8px;z-index:10;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
  #theme-toggle:hover{background:var(--chip);color:var(--fg)}
  .theme-ico-sun,.theme-ico-moon{display:none}
  :root:not(.light) .theme-ico-sun{display:inline}
  :root.light .theme-ico-moon{display:inline}
  /* --- end light theme --- */
  body{font:14px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--text);margin:0;padding:1.5rem}
  h1{font-size:1rem;font-weight:600;margin:0 0 1rem;color:var(--accent)}
  .wrap{display:grid;grid-template-columns:1fr 360px;gap:1.25rem;max-width:1100px}
  textarea{width:100%;height:340px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.75rem;font:13px/1.45 ui-monospace,monospace;resize:vertical;box-sizing:border-box}
  button{background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.45rem .8rem;font:13px ui-monospace,monospace;cursor:pointer;margin-right:.4rem}
  button:hover{border-color:var(--accent)}
  .leds{display:flex;gap:.5rem;margin:1rem 0}
  .led{width:34px;height:34px;border-radius:50%;background:#161b22;border:1px solid #30363d}
  .led.on{background:#7ee787;border-color:#7ee787;box-shadow:0 0 10px #7ee787}
  pre{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:.75rem;margin:.5rem 0;white-space:pre-wrap;font-size:12px;max-height:210px;overflow:auto}
  .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:.6rem 0 .25rem}
  #status{color:var(--muted)}
</style>
</head>
<body>
<!-- Theme toggle (remove for dark-only) -->
<button id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
  <svg class="theme-ico-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  <svg class="theme-ico-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<script>
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var light = document.documentElement.classList.toggle('light');
    try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
  });
</script>
<h1>go6sim · CodeLab (local spike) — 8-LED controller</h1>
<div class="wrap">
  <div>
    <div class="lbl">6502 source — stores to VIA Port B ($B000 = 8 LEDs)</div>
    <textarea id="src" spellcheck="false"></textarea>
    <div style="margin-top:.6rem">
      <button id="run">▶ Assemble &amp; Run</button>
      <button id="stop">■ Stop</button>
      <button id="step">⤳ Step</button>
      <button id="reset">↺ Reset</button>
      <span id="status">loading wasm…</span>
    </div>
    <div class="lbl">assembler / errors</div>
    <pre id="err">—</pre>
  </div>
  <div>
    <div class="lbl">VIA Port B — 8 LEDs (bit 7 … bit 0)</div>
    <div class="leds" id="leds"></div>
    <div class="lbl">CPU</div>
    <pre id="regs">—</pre>
    <div class="lbl">disassembly</div>
    <pre id="dis">—</pre>
  </div>
</div>
<script src="wasm_exec.js"></script>
<script>
const SEED = `; 8 LEDs on VIA Port B — a binary counter.
        LDX #$00
loop:   STX ViaBase        ; ViaBase = $B000 = VIA port B (the 8 LEDs)
        INX
        LDY #$00
delay:  INY
        BNE delay
        JMP loop
`;
const $ = id => document.getElementById(id);
$('src').value = SEED;

const leds = [];
for (let i = 0; i < 8; i++) { const d = document.createElement('div'); d.className = 'led'; $('leds').appendChild(d); leds.push(d); }

async function startGo(file) {
  const go = new Go();
  let res;
  try { res = await WebAssembly.instantiateStreaming(fetch(file), go.importObject); }
  catch { res = await WebAssembly.instantiate(await (await fetch(file)).arrayBuffer(), go.importObject); }
  go.run(res.instance); // blocks on select{}; sets its global first
}

let asm, sim, running = false, raf = 0;
const hex = n => '$' + n.toString(16).toUpperCase().padStart(2, '0');

function renderLEDs() {
  const v = sim.peek(0xB000);
  for (let i = 0; i < 8; i++) leds[i].classList.toggle('on', !!(v & (1 << (7 - i))));
}
function renderRegs() {
  const s = sim.state();
  $('regs').textContent =
    `A=${hex(s.a)} X=${hex(s.x)} Y=${hex(s.y)} SP=${hex(s.sp)} P=${hex(s.p)}\n` +
    `PC=$${s.pc.toString(16).toUpperCase().padStart(4, '0')}  cyc=${s.halfCycles}  ${s.running ? 'RUN' : 'STOP'}`;
}
function frame() { if (!running) return; sim.advance(16); renderLEDs(); renderRegs(); raf = requestAnimationFrame(frame); }

function assembleAndRun() {
  cancelAnimationFrame(raf); running = false;
  const r = asm.assemble({ source: $('src').value, target: 'sim-tui', simple: true });
  if (!r.success) { $('err').textContent = 'assemble errors:\n' + JSON.stringify(r.errors, null, 1); return; }
  $('err').textContent = 'assembled OK — ' + r.bytes.length + ' bytes @ $' + r.origin.toString(16).toUpperCase();
  $('dis').textContent = r.disasm || '—';
  const lo = sim.load(r.bytes);
  if (lo && lo.error) { $('err').textContent = 'load: ' + lo.error; return; }
  sim.setSpeedHz(1000); renderLEDs(); renderRegs();
  running = true; sim.setRunning(true); raf = requestAnimationFrame(frame);
}
$('run').onclick = assembleAndRun;
$('stop').onclick = () => { running = false; sim.setRunning(false); cancelAnimationFrame(raf); renderRegs(); };
$('step').onclick = () => { running = false; sim.setRunning(false); cancelAnimationFrame(raf); sim.step(1); renderLEDs(); renderRegs(); };
$('reset').onclick = () => { running = false; sim.setRunning(false); cancelAnimationFrame(raf); sim.reset(); renderLEDs(); renderRegs(); };

(async () => {
  await startGo('go6asm.wasm');
  await startGo('core.wasm');
  for (let i = 0; i < 200 && !(globalThis.go6asm && globalThis.go6sim); i++) await new Promise(r => setTimeout(r, 5));
  asm = globalThis.go6asm; sim = globalThis.go6sim;
  $('status').textContent = (asm && sim) ? 'ready — press ▶ Assemble & Run' : 'wasm failed to load';
})();
</script>
</body>
</html>
